<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <style>
      .page{fill:#fbfcff}.blue{fill:#1768c2}.green{fill:#24945f}.purple{fill:#6651b8}.orange{fill:#ee7d22}.dark{fill:#334155}.panel{fill:#fff;stroke:#a6bddb;stroke-width:1.6;rx:9}.pblue{fill:#edf6ff;stroke:#82b1e8}.pgreen{fill:#eefaf4;stroke:#7dbf90}.ppurple{fill:#f4efff;stroke:#a38ada}.porange{fill:#fff5e6;stroke:#e7b26d}.title{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#111827}.h{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#143d75}.hwhite{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#fff}.t{font:11px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#27384d}.tiny{font:10px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#607083}.num{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#fff}.arrow{stroke:#4f79ad;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:5 4}.icon{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI Symbol","Microsoft YaHei",sans-serif;fill:#1768c2}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4 L0,8 z" fill="#4f79ad"/></marker>
  </defs>
  <rect class="page" width="1280" height="720"/>
  <text x="640" y="42" text-anchor="middle" class="title">SFA Harness 知识库架构全景图</text>
  <text x="640" y="64" text-anchor="middle" class="tiny">以 repo 内结构化事实替代一次性 prompt；用 registry、baseline、templates、rules、changes、evals 支撑渐进加载和可审计复用</text>

  <rect x="26" y="82" width="110" height="84" rx="6" class="blue"/><text x="81" y="116" text-anchor="middle" class="hwhite">1. 数据来源层</text>
  <rect x="154" y="86" width="142" height="72" class="panel"/><text x="176" y="118" class="icon">◇</text><text x="214" y="110" class="h">源码仓库</text><text x="214" y="130" class="tiny">10 repos / 多仓变量</text><text x="214" y="146" class="tiny">Java / Vue / App</text>
  <rect x="316" y="86" width="142" height="72" class="panel"/><text x="338" y="118" class="icon">▤</text><text x="376" y="110" class="h">人工知识沉淀</text><text x="376" y="130" class="tiny">docs / baseline</text><text x="376" y="146" class="tiny">decision / review</text>
  <rect x="478" y="86" width="142" height="72" class="panel"/><text x="500" y="118" class="icon">▥</text><text x="538" y="110" class="h">变更工件</text><text x="538" y="130" class="tiny">47 changes</text><text x="538" y="146" class="tiny">evidence / status</text>
  <rect x="640" y="86" width="142" height="72" class="panel"/><text x="662" y="118" class="icon">⚙</text><text x="700" y="110" class="h">脚本门禁</text><text x="700" y="130" class="tiny">147 scripts</text><text x="700" y="146" class="tiny">39 gate</text>
  <rect x="802" y="86" width="142" height="72" class="panel"/><text x="824" y="118" class="icon">☷</text><text x="862" y="110" class="h">Agent Registry</text><text x="862" y="130" class="tiny">7 agents</text><text x="862" y="146" class="tiny">权限/契约/降级</text>
  <rect x="964" y="86" width="142" height="72" class="panel"/><text x="986" y="118" class="icon">◎</text><text x="1024" y="110" class="h">Eval Assets</text><text x="1024" y="130" class="tiny">113 files</text><text x="1024" y="146" class="tiny">golden / replay</text>

  <rect x="26" y="188" width="110" height="208" rx="6" class="green"/><text x="81" y="250" text-anchor="middle" class="hwhite">2. Guides 与</text><text x="81" y="274" text-anchor="middle" class="hwhite">Sensors 能力层</text><text x="81" y="302" text-anchor="middle" class="hwhite">(确定边界)</text>
  <rect x="154" y="206" width="210" height="72" class="panel pgreen"/><circle cx="172" cy="224" r="9" class="green"/><text x="172" y="228" text-anchor="middle" class="num">1</text><text x="190" y="225" class="h">templates / artifact profiles</text><text x="190" y="247" class="t">38 templates；tier-s / tier-m / tier-l</text><text x="190" y="264" class="t">明确每类 change 应交付哪些文件</text>
  <rect x="396" y="206" width="210" height="72" class="panel pgreen"/><circle cx="414" cy="224" r="9" class="green"/><text x="414" y="228" text-anchor="middle" class="num">2</text><text x="432" y="225" class="h">rules / lanes / skills</text><text x="432" y="247" class="t">30 rules；6 skills；3 lanes</text><text x="432" y="264" class="t">按业务类型渐进加载团队规则</text>
  <rect x="638" y="206" width="210" height="72" class="panel pgreen"/><circle cx="656" cy="224" r="9" class="green"/><text x="656" y="228" text-anchor="middle" class="num">3</text><text x="674" y="225" class="h">gate registry</text><text x="674" y="247" class="t">L3 hard safety / L2 quality</text><text x="674" y="264" class="t">把“应该遵守”变成 fail-closed</text>
  <rect x="880" y="206" width="210" height="72" class="panel pgreen"/><circle cx="898" cy="224" r="9" class="green"/><text x="898" y="228" text-anchor="middle" class="num">4</text><text x="916" y="225" class="h">agent registry</text><text x="916" y="247" class="t">active vs candidate</text><text x="916" y="264" class="t">输入、输出、权限、degradation</text>

  <rect x="154" y="302" width="210" height="72" class="panel porange"/><text x="178" y="330" class="icon">▣</text><text x="218" y="322" class="h">业务仓 baseline</text><text x="218" y="344" class="t">10 个 docs/baseline/*.md</text><text x="218" y="361" class="t">验证命令候选、技术栈、保护路径</text>
  <rect x="396" y="302" width="210" height="72" class="panel porange"/><text x="420" y="330" class="icon">☑</text><text x="460" y="322" class="h">change 状态包</text><text x="460" y="344" class="t">harness-status / evidence</text><text x="460" y="361" class="t">用户确认、阻塞、验证结果</text>
  <rect x="638" y="302" width="210" height="72" class="panel porange"/><text x="662" y="330" class="icon">⚑</text><text x="702" y="322" class="h">OpenSpec 控制面</text><text x="702" y="344" class="t">5 个 openspec/changes</text><text x="702" y="361" class="t">proposal / tasks / specs</text>
  <rect x="880" y="302" width="210" height="72" class="panel porange"/><text x="904" y="330" class="icon">⟳</text><text x="944" y="322" class="h">eval / telemetry</text><text x="944" y="344" class="t">replay / golden / suite</text><text x="944" y="361" class="t">聚合指标反哺 gate 演进</text>

  <rect x="26" y="418" width="110" height="150" rx="6" class="purple"/><text x="81" y="475" text-anchor="middle" class="hwhite">3. 知识结构层</text><text x="81" y="500" text-anchor="middle" class="hwhite">(三层寻址)</text>
  <rect x="154" y="428" width="190" height="120" class="panel ppurple"/>
  <text x="170" y="452" class="h">A 全局入口</text><text x="176" y="478" class="t">AGENTS.md / README</text><text x="176" y="500" class="t">docs/architecture/*</text><text x="176" y="522" class="t">repo-registry / gate-registry</text>
  <rect x="368" y="428" width="250" height="120" class="panel ppurple"/>
  <text x="384" y="452" class="h">B 目标仓与规则层</text><text x="390" y="478" class="t">docs/baseline/{repo}.md</text><text x="390" y="500" class="t">rules/backend-java / frontend-vue2 / mobile</text><text x="390" y="522" class="t">lanes/fullstack-crud / bugfix / pc-e2e</text>
  <rect x="642" y="428" width="278" height="120" class="panel ppurple"/>
  <text x="658" y="452" class="h">C Active Change 层</text><text x="664" y="478" class="t">changes/&lt;id&gt;/spec / contract / solution</text><text x="664" y="500" class="t">ai-test-plan / verification-map / evidence</text><text x="664" y="522" class="t">review / retro / local-routing / smoke report</text>
  <rect x="944" y="428" width="246" height="120" class="panel ppurple"/>
  <text x="960" y="452" class="h">D 历史复用与评测层</text><text x="966" y="478" class="t">按 change-id / field / path 定向检索</text><text x="966" y="500" class="t">Business Golden 脱敏样例</text><text x="966" y="522" class="t">Telemetry 聚合趋势，不读敏感原文</text>

  <rect x="1036" y="188" width="218" height="208" rx="8" fill="#fff8ef" stroke="#e9ad68" stroke-width="1.6"/>
  <rect x="1036" y="188" width="218" height="34" rx="8" class="orange"/><text x="1145" y="211" text-anchor="middle" class="hwhite">4. 知识使用方式</text>
  <text x="1056" y="248" class="h">查询流程</text>
  <rect x="1060" y="262" width="170" height="27" rx="6" fill="#fff" stroke="#efc08c"/><text x="1072" y="280" class="tiny">L1：读入口 + active change</text>
  <rect x="1060" y="298" width="170" height="27" rx="6" fill="#fff" stroke="#efc08c"/><text x="1072" y="316" class="tiny">L2：按 repo-id 定位 baseline</text>
  <rect x="1060" y="334" width="170" height="27" rx="6" fill="#fff" stroke="#efc08c"/><text x="1072" y="352" class="tiny">L3：按模式加载必要文档</text>
  <text x="1056" y="382" class="tiny">原则：少加载、强证据、可回写</text>

  <rect x="26" y="590" width="760" height="48" rx="8" class="blue"/>
  <text x="56" y="620" class="hwhite">AI 生产（生成/实现） → 人工确认（业务口径） → AI 消费（查询/验证） → AI 维护（评测/新鲜度/复盘）</text>
  <rect x="804" y="590" width="420" height="48" rx="8" fill="#f8fafc" stroke="#c9d7e6"/>
  <text x="826" y="612" class="h">当前边界</text><text x="826" y="630" class="tiny">不先上 RAG；不保存敏感原文；不把 chat memory 当当前事实；可复用事实进入 repo</text>
  <path class="arrow" d="M296 158 L296 206"/><path class="arrow" d="M458 158 L458 206"/><path class="arrow" d="M620 158 L680 206"/><path class="arrow" d="M944 158 L980 206"/>
  <path class="arrow dash" d="M1145 396 C1145 660 180 660 230 548"/>
</svg>
