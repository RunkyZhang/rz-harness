<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <style>
      .page{fill:#f7fbff}.panel{fill:#fff;stroke:#9fc2ef;stroke-width:1.7;rx:10}.panelBlue{fill:#edf6ff;stroke:#75a9e8}.panelGreen{fill:#effaf4;stroke:#78bd8c}.panelOrange{fill:#fff5e7;stroke:#e6b06a}.panelGray{fill:#f8fafc;stroke:#c9d7e6}.blue{fill:#1768c2}.green{fill:#238b57}.orange{fill:#ef7d21}.purple{fill:#6f51bd}.title{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#123d7a}.sub{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#5c6d80}.h{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#17447e}.h2{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#17447e}.t{font:11px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#27384d}.tiny{font:10px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#607083}.white{fill:#fff}.num{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#fff}.arrow{stroke:#2c75c6;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:5 4}.thin{stroke:#9ab6d5;stroke-width:1.2;fill:none}.icon{font:700 23px -apple-system,BlinkMacSystemFont,"Segoe UI Symbol","Microsoft YaHei",sans-serif;fill:#1768c2}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4 L0,8 z" fill="#2c75c6"/></marker>
  </defs>
  <rect class="page" width="1280" height="720"/>
  <rect x="8" y="14" width="1264" height="250" class="panel panelBlue"/>
  <text x="640" y="43" text-anchor="middle" class="title">SFA Harness 端到端开发流程（状态卡驱动）</text>
  <text x="640" y="64" text-anchor="middle" class="sub">从需求进入到人工收口：以 changes/&lt;change-id&gt;/harness-status.md 为状态源，以 gate / evidence / Test Agent / Reviewer 保证流程不停在“看起来完成”</text>

  <rect x="24" y="34" width="112" height="96" rx="8" fill="#fff" stroke="#9fc2ef" stroke-width="1.5"/>
  <rect x="24" y="34" width="112" height="28" rx="7" fill="#1768c2"/>
  <text x="80" y="53" text-anchor="middle" class="num">入口模式</text>
  <text x="48" y="86" class="icon">●</text><text x="78" y="82" class="h2">单需求模式</text>
  <text x="78" y="103" class="tiny">Tier S/M/L</text><text x="78" y="119" class="tiny">直接进入状态卡</text>
  <rect x="24" y="148" width="112" height="94" rx="8" fill="#fff" stroke="#9fc2ef" stroke-width="1.5"/>
  <text x="48" y="183" class="icon">◆</text><text x="78" y="174" class="h2">产品需求模式</text>
  <text x="78" y="195" class="tiny">多仓 / 多端</text><text x="78" y="211" class="tiny">先拆解再分流</text>

  <g id="phases">
    <rect x="160" y="84" width="92" height="100" class="panel"/>
    <circle cx="176" cy="99" r="12" class="blue"/><text x="176" y="103" text-anchor="middle" class="num">0</text>
    <text x="206" y="103" text-anchor="middle" class="h2">需求澄清</text><text x="206" y="134" text-anchor="middle" class="icon">☷</text><text x="206" y="160" text-anchor="middle" class="tiny">spec / status</text>
    <rect x="264" y="84" width="92" height="100" class="panel"/>
    <circle cx="280" cy="99" r="12" class="blue"/><text x="280" y="103" text-anchor="middle" class="num">1</text>
    <text x="310" y="103" text-anchor="middle" class="h2">任务拆解</text><text x="310" y="134" text-anchor="middle" class="icon">☰</text><text x="310" y="160" text-anchor="middle" class="tiny">plan / OpenSpec</text>
    <rect x="368" y="84" width="92" height="100" class="panel"/>
    <circle cx="384" cy="99" r="12" class="blue"/><text x="384" y="103" text-anchor="middle" class="num">2</text>
    <text x="414" y="103" text-anchor="middle" class="h2">契约冻结</text><text x="414" y="134" text-anchor="middle" class="icon">&lt;/&gt;</text><text x="414" y="160" text-anchor="middle" class="tiny">contract v0.1</text>
    <rect x="472" y="84" width="92" height="100" class="panel"/>
    <circle cx="488" cy="99" r="12" class="blue"/><text x="488" y="103" text-anchor="middle" class="num">3</text>
    <text x="518" y="103" text-anchor="middle" class="h2">方案确认</text><text x="518" y="134" text-anchor="middle" class="icon">▣</text><text x="518" y="160" text-anchor="middle" class="tiny">solution gate</text>
    <rect x="576" y="84" width="92" height="100" class="panel"/>
    <circle cx="592" cy="99" r="12" class="blue"/><text x="592" y="103" text-anchor="middle" class="num">4</text>
    <text x="622" y="103" text-anchor="middle" class="h2">测试计划</text><text x="622" y="134" text-anchor="middle" class="icon">⚗</text><text x="622" y="160" text-anchor="middle" class="tiny">AI test plan</text>
    <rect x="680" y="84" width="92" height="100" class="panel"/>
    <circle cx="696" cy="99" r="12" class="blue"/><text x="696" y="103" text-anchor="middle" class="num">5</text>
    <text x="726" y="103" text-anchor="middle" class="h2">业务实现</text><text x="726" y="134" text-anchor="middle" class="icon">⚙</text><text x="726" y="160" text-anchor="middle" class="tiny">Main Agent</text>
    <rect x="784" y="84" width="92" height="100" class="panel"/>
    <circle cx="800" cy="99" r="12" class="blue"/><text x="800" y="103" text-anchor="middle" class="num">6</text>
    <text x="830" y="103" text-anchor="middle" class="h2">常规验证</text><text x="830" y="134" text-anchor="middle" class="icon">✓</text><text x="830" y="160" text-anchor="middle" class="tiny">test / lint</text>
    <rect x="888" y="84" width="92" height="100" class="panel"/>
    <circle cx="904" cy="99" r="12" class="blue"/><text x="904" y="103" text-anchor="middle" class="num">7</text>
    <text x="934" y="103" text-anchor="middle" class="h2">独立验证</text><text x="934" y="134" text-anchor="middle" class="icon">◎</text><text x="934" y="160" text-anchor="middle" class="tiny">Test Agent</text>
  </g>
  <path class="arrow" d="M136 133 L160 133"/><path class="arrow" d="M252 134 L264 134"/><path class="arrow" d="M356 134 L368 134"/><path class="arrow" d="M460 134 L472 134"/><path class="arrow" d="M564 134 L576 134"/><path class="arrow" d="M668 134 L680 134"/><path class="arrow" d="M772 134 L784 134"/><path class="arrow" d="M876 134 L888 134"/>

  <rect x="1012" y="30" width="238" height="204" rx="9" fill="#fffdf8" stroke="#e4b071" stroke-width="1.6"/>
  <text x="1131" y="55" text-anchor="middle" fill="#da6a1f" font-size="14" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Microsoft YaHei'">产品需求模式：Phase R → Fork-Join</text>
  <rect x="1030" y="72" width="202" height="44" rx="7" fill="#fff7eb" stroke="#efbf84"/>
  <text x="1044" y="91" class="h2">Phase R 产品需求拆解</text><text x="1044" y="108" class="tiny">PRD → 子需求 → workstream → product-state</text>
  <rect x="1030" y="126" width="202" height="44" rx="7" fill="#fff7eb" stroke="#efbf84"/>
  <text x="1044" y="145" class="h2">Fork 段并行</text><text x="1044" y="162" class="tiny">每个子需求跑 Phase 0-7，不提交</text>
  <rect x="1030" y="180" width="202" height="44" rx="7" fill="#fff7eb" stroke="#efbf84"/>
  <text x="1044" y="199" class="h2">Join 段收口</text><text x="1044" y="216" class="tiny">merge → test report → reviewer → PR/SIT</text>

  <rect x="154" y="204" width="826" height="38" rx="8" fill="#f1f5f9" stroke="#bdcadb"/>
  <text x="567" y="228" text-anchor="middle" class="h">状态卡驱动：harness-status.md 记录阶段、停止点、待确认项、证据和下一步</text>
  <path class="arrow" d="M566 242 L566 277"/>

  <rect x="8" y="274" width="1264" height="116" class="panel panelGray"/>
  <rect x="24" y="302" width="280" height="66" class="panel"/>
  <text x="48" y="330" class="icon">▤</text><text x="86" y="322" class="h">1 状态文件驱动</text><text x="86" y="344" class="tiny">spec / contract / solution / evidence</text><text x="86" y="360" class="tiny">状态卡是人工可见入口，不依赖聊天记忆</text>
  <rect x="320" y="302" width="280" height="66" class="panel"/>
  <text x="344" y="330" class="icon">🛡</text><text x="386" y="322" class="h">2 Gate 机制</text><text x="386" y="344" class="tiny">39 个 gate 按 L3/L2/L1/L0 分层</text><text x="386" y="360" class="tiny">硬边界失败即停止，不靠模型自觉</text>
  <rect x="616" y="302" width="280" height="66" class="panel"/>
  <text x="640" y="330" class="icon">▦</text><text x="682" y="322" class="h">3 Agent 权限隔离</text><text x="682" y="344" class="tiny">orchestrator / explorer / reviewer / test</text><text x="682" y="360" class="tiny">implementation agent 仍为 candidate</text>
  <rect x="912" y="302" width="334" height="66" class="panel"/>
  <text x="936" y="330" class="icon">▣</text><text x="978" y="322" class="h">4 脚本工具箱（确定性执行）</text><text x="978" y="344" class="tiny">147 scripts：local routing / mvn targeted / frontend lint-build / eval suite</text><text x="978" y="360" class="tiny">执行、检查、聚合、路由交给脚本</text>

  <rect x="8" y="398" width="1264" height="306" class="panel"/>
  <text x="640" y="421" text-anchor="middle" class="h">知识控制面（Knowledge Control Plane）→ 为上层流程提供可追溯上下文</text>

  <rect x="26" y="438" width="205" height="148" rx="8" fill="#f3f8ff" stroke="#9fc2ef"/>
  <circle cx="43" cy="456" r="9" class="blue"/><text x="43" y="460" text-anchor="middle" class="num">1</text><text x="62" y="460" class="h2">业务仓 registry</text>
  <polygon points="54,562 104,480 154,562" fill="#dcecff" stroke="#8bb5ea"/><line x1="75" y1="526" x2="133" y2="526" class="thin"/><line x1="64" y1="546" x2="144" y2="546" class="thin"/>
  <text x="104" y="510" text-anchor="middle" class="tiny">10 repos</text><text x="104" y="536" text-anchor="middle" class="tiny">baseline / env vars</text><text x="104" y="557" text-anchor="middle" class="tiny">backend / web / mobile</text>

  <rect x="244" y="438" width="205" height="148" rx="8" fill="#f8fbff" stroke="#9fc2ef"/>
  <circle cx="261" cy="456" r="9" class="blue"/><text x="261" y="460" text-anchor="middle" class="num">2</text><text x="280" y="460" class="h2">Guides 指导层</text>
  <text x="270" y="488" class="t">AGENTS.md / README</text><text x="270" y="512" class="t">38 templates</text><text x="270" y="536" class="t">30 rules</text><text x="270" y="560" class="t">6 skills + lanes</text>

  <rect x="462" y="438" width="245" height="148" rx="8" fill="#f4fff8" stroke="#8dc99e"/>
  <circle cx="479" cy="456" r="9" class="green"/><text x="479" y="460" text-anchor="middle" class="num">3</text><text x="498" y="460" class="h2">状态与工件</text>
  <text x="488" y="488" class="t">changes/&lt;change-id&gt;/</text><text x="488" y="512" class="t">tier-s / tier-m / tier-l</text><text x="488" y="536" class="t">evidence / review / test report</text><text x="488" y="560" class="t">47 个历史变更包可定向复用</text>

  <rect x="720" y="438" width="245" height="148" rx="8" fill="#fff9ef" stroke="#e5b36f"/>
  <circle cx="737" cy="456" r="9" class="orange"/><text x="737" y="460" text-anchor="middle" class="num">4</text><text x="756" y="460" class="h2">Agent / Gate Registry</text>
  <text x="746" y="488" class="t">7 agents：4 active + 3 candidate</text><text x="746" y="512" class="t">39 gates：L3/L2/L1/L0</text><text x="746" y="536" class="t">input/output contract</text><text x="746" y="560" class="t">dispatch plan + output gate</text>

  <rect x="978" y="438" width="250" height="148" rx="8" fill="#f7f2ff" stroke="#ad93df"/>
  <circle cx="995" cy="456" r="9" class="purple"/><text x="995" y="460" text-anchor="middle" class="num">5</text><text x="1014" y="460" class="h2">Eval / Telemetry</text>
  <text x="1004" y="488" class="t">Business Golden：6 seed cases</text><text x="1004" y="512" class="t">Replay：3 scenarios / 8 fixtures</text><text x="1004" y="536" class="t">Eval suite：12 default checks</text><text x="1004" y="560" class="t">11 类 allowlisted telemetry events</text>

  <rect x="26" y="606" width="430" height="74" rx="8" fill="#f8fbff" stroke="#9fc2ef"/>
  <text x="42" y="630" class="h2">知识查询方式：渐进加载 + 精确检索</text>
  <text x="42" y="653" class="tiny">先读 active change / repo registry → 再按 repo-id、change-id、gate-id、agent-id、接口、字段定向加载</text>
  <text x="42" y="670" class="tiny">不把历史 changes 或 memory 全量灌入上下文；重要结论必须回落到 repo 工件</text>

  <rect x="476" y="606" width="350" height="74" rx="8" fill="#fff9ef" stroke="#e5b36f"/>
  <text x="492" y="630" class="h2">当前四类消费场景</text>
  <text x="492" y="653" class="tiny">A 需求拆解  B 技术方案  C 实现/验证  D Reviewer / Eval 复盘</text>
  <text x="492" y="670" class="tiny">每类只加载必要上下文，减少 token 和误导性历史知识</text>

  <rect x="846" y="606" width="382" height="74" rx="8" fill="#f4fff8" stroke="#8dc99e"/>
  <text x="862" y="630" class="h2">收益目标</text>
  <text x="862" y="653" class="tiny">统一事实源、减少重复 prompt、控制风险、沉淀证据、支持复盘与 gate 演进</text>
  <text x="862" y="670" class="tiny">核心口径：AI 负责认知，脚本负责执行，gate 负责停止，证据负责闭环</text>
</svg>
