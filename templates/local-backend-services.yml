# Harness local backend service registry.
# Copy to changes/<change-id>/local-backend-services.yml only when the project
# defaults are not enough. Prefer keeping durable mappings in harness docs.

fallback_base_url: http://dev-api.hotkidceo.com/
proxy_listen:
  host: 127.0.0.1
  port: 19080
services:
  - backend_repo: sfa-sales-management
    frontend_prefix: /sfa/salesmanagement
    strip_prefix: /sfa/salesmanagement
    backend_prefix: /
    local_target: $RZ_LOCAL_BACKEND_SALES_MANAGEMENT_URL
    frontend_repos: mapSystem
    source_contract: git-registry.md
    reason: sfa-sales-management owns the sfa salesmanagement service prefix
  - backend_repo: sfa-backend
    frontend_prefix: /sfa/backend
    strip_prefix: /sfa/backend
    backend_prefix: /
    local_target: $RZ_LOCAL_BACKEND_SFA_BACKEND_URL
    frontend_repos: mapSystem
    source_contract: git-registry.md
    reason: sfa-backend owns the sfa backend service prefix
# 注：标本的 backend-ceo-member 不在 RZ 工作范围（见 git-registry.md），已移除；需要时自行补。
